name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package Real IPA
        run: |
          echo "Đang chuẩn bị thư mục Payload cho ứng dụng..."
          mkdir -p build/Payload/ShinnH4k.app

          echo "Đang tiến hành biên dịch toàn bộ mã nguồn Swift thành ứng dụng thực tế..."
          # Lệnh gom và biên dịch tất cả các tệp .swift trong thư mục hiện tại thành file chạy chính của ứng dụng
          swiftc -parse-as-library \
            *.swift \
            -o build/Payload/ShinnH4k.app/ShinnH4k \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios15.0 \
            -framework SwiftUI -framework Foundation -framework UIKit

          echo "Đang tạo tệp Info.plist cấu hình hệ thống..."
          cat << 'EOF' > build/Payload/ShinnH4k.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.shinn.h4kstore</string>
              <key>CFBundleName</key>
              <string>Shinn H4k</string>
              <key>CFBundleDisplayName</key>
              <string>Shinn H4k</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0</string>
              <key>CFBundleVersion</key>
              <string>2026.2.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          echo "Đang nén thư mục thành file IPA chuẩn..."
          cd build
          zip -r ShinnH4k-v2.0.ipa Payload
          echo "Đóng gói tệp IPA hoàn tất!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4k-v2.0-IPA
          path: build/ShinnH4k-v2.0.ipa
