name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Shinn H4k IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Swift files into App Binary
        run: |
          echo "Đang biên dịch mã nguồn SwiftUI..."
          mkdir -p Payload/ShinnH4k.app
          
          # Biên dịch toàn bộ các file Swift theo đúng thứ tự thành tệp thực thi chính
          swiftc -parse-as-library \
            AppTheme.swift \
            StoreModels.swift \
            GlowEffects.swift \
            HeaderView.swift \
            HeroBannerView.swift \
            SectionHeaderView.swift \
            PackageRowView.swift \
            ShinnStoreView.swift \
            ContentView.swift \
            -o Payload/ShinnH4k.app/ShinnH4k \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios15.0 \
            -framework SwiftUI -framework Foundation -framework UIKit

          # Tạo file cấu hình Info.plist với thông tin chuẩn yêu cầu
          cat << 'EOF' > Payload/ShinnH4k.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.apple.mobile.MobileHouseArrest</string>
              <key>CFBundleName</key>
              <string>Shinn H4k</string>
              <key>CFBundleDisplayName</key>
              <string>Shinn H4k</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0</string>
              <key>CFBundleVersion</key>
              <string>2026.2.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Package into IPA
        run: |
          echo "Đang đóng gói tệp .ipa..."
          zip -r ShinnH4k.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4k-v2.0-IPA
          path: ShinnH4k.ipa
