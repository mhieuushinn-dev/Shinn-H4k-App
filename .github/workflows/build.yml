name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package Real IPA
        run: |
          echo "Đang tiến hành biên dịch mã nguồn Swift thành ứng dụng thực tế..."
          mkdir -p build/Payload/ShinnH4k.app

          # Biên dịch toàn bộ các file Swift thành file thực thi nhị phân chuẩn iOS (arm64)
          swiftc -parse-as-library \
            AppTheme.swift \
            StoreModels.swift \
            GlowEffects.swift \
            HeaderView.swift \
            HeroBannerView.swift \
            SectionHeaderView.swift \
            PackageRowView.swift \
            ShinnStoreView.swift \
            ContentView.swift \
            -o build/Payload/ShinnH4k.app/ShinnH4k \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios15.0 \
            -framework SwiftUI -framework Foundation -framework UIKit

          # Tạo file Info.plist cấu hình đầy đủ Bundle ID và thông tin ứng dụng
          cat << 'EOF' > build/Payload/ShinnH4k.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.apple.mobile.MobileHouseArrest</string>
              <key>CFBundleName</key>
              <string>Shinn H4k</string>
              <key>CFBundleDisplayName</key>
              <string>Shinn H4k</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0</string>
              <key>CFBundleVersion</key>
              <string>2026.2.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          # Nén thành tệp IPA chuẩn
          cd build
          zip -r ShinnH4k-v2.0.ipa Payload
          echo "Đã đóng gói IPA thành công!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4k-v2.0-IPA
          path: build/ShinnH4k-v2.0.ipa
