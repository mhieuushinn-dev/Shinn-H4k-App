name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0' # Chọn phiên bản Xcode phù hợp với dự án của bạn

      - name: Build and Package IPA
        run: |
          echo "Dang bien dich ma nguon Swift..."
          
          # Tạo thư mục chứa file build
          mkdir -p build/Payload
          
          # Build project (Thay thế 'ShinnStoreApp' bằng tên Scheme hoặc Workspace thực tế của bạn)
          xcodebuild -scheme "ShinnStoreApp" \
                     -sdk iphoneos \
                     -configuration Release \
                     archive \
                     -archivePath build/ShinnStore.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO
          
          # Đóng gói thành file IPA (Chế độ unsigned/sideload)
          cp -r build/ShinnStore.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ShinnStore.ipa Payload
          echo "Build IPA thanh cong!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnStore-IPA
          path: build/ShinnStore.ipa
