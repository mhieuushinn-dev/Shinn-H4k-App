name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          if [ -f "ShinnH4k_v5_BlackWhite.zip" ]; then
            unzip -o "ShinnH4k_v5_BlackWhite.zip" -d extracted
          else
            mkdir -p extracted
            cp -R * extracted/ || true
          fi

      - name: Build App
        run: |
          cd extracted
          # Tự động tìm tệp cấu hình .xcodeproj bên trong thư mục đã giải nén
          PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          echo "Found project: $PROJECT_FILE"
          
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "ThreeOneOSFive" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive and Prepare IPA
        run: |
          cd extracted
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ShinnH4k.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4k-Signed-IPA
          path: extracted/ShinnH4k.ipa
